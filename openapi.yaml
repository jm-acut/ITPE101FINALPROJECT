          description: A suggestion, or an honest 'no match'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AssistantOk"
                  - $ref: "#/components/schemas/AssistantNoMatch"
              example:
                success: true
                data:
                  status: no_match
                  message: I could not put together a fully compatible build for that request.
                  problems:
                    - The total (₱65,000) is above the budget (₱60,000).
                  aiAssisted: true
