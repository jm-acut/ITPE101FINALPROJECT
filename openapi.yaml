openapi: 3.0.3
info:
  title: NEXUS PC API
  version: 1.0.0
  description: |-
    REST API for the NEXUS PC store: catalog, cart, checkout, Maya payments, admin tools, PC compatibility checks, build saving and sharing, and an AI build advisor.

    **Conventions**
    - Success: `{ "success": true, "data": ..., "meta": ... }`. Errors: `{ "success": false, "error": { "code", "message", "details" }, "requestId" }`.
    - Money is always an integer number of centavos (`1399000` = PHP 13,990.00). Prices are calculated on the server.
    - Authenticated routes need `Authorization: Bearer <token>` (use the Authorize button). Admin routes need an admin token.
    - Lists are paginated with `page` and `limit`.
servers:
  - url: /api/v1
    description: This server
  - url: http://localhost:5000/api/v1
    description: Local development
tags:
  - name: System
  - name: Auth
  - name: Catalog
  - name: Cart
  - name: Orders
  - name: Payments
  - name: Builds
  - name: AI assistant
  - name: Admin
paths:
  /health:
    get:
      tags:
        - System
      operationId: health
      summary: Check that the API and database are up
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Health"
                required:
                  - success
                  - data
              example:
                success: true
                data:
                  status: ok
                  database: connected
  /auth/register:
    post:
      tags:
        - Auth
      operationId: register
      summary: Create a customer account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
            example:
              name: Juan Dela Cruz
              email: juan@nexuspc.test
              password: Secret1234
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/AuthResult"
                required:
                  - success
                  - data
              example:
                success: true
                data:
                  user:
                    id: 3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                    name: Juan Dela Cruz
                    email: juan@nexuspc.test
                    role: customer
                    createdAt: 2026-11-12T08:30:00.000Z
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "409":
          description: "Error 409: EMAIL_TAKEN"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: EMAIL_TAKEN
                  message: An account with this email already exists.
                requestId: 7a2b9c1d-4e3f-4a5b-9c6d-1e2f3a4b5c6d
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: "Error 429: AUTH_RATE_LIMITED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: AUTH_RATE_LIMITED
                  message: Too many sign-in attempts. Try again in a few minutes.
                requestId: 7a2b9c1d-4e3f-4a5b-9c6d-1e2f3a4b5c6d
  /auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Sign in and receive a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
            example:
              email: juan@nexuspc.test
              password: Customer1234
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/AuthResult"
                required:
                  - success
                  - data
              example:
                success: true
                data:
                  user:
                    id: 3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                    name: Juan Dela Cruz
                    email: juan@nexuspc.test
                    role: customer
                    createdAt: 2026-11-12T08:30:00.000Z
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "401":
          description: "Error 401: INVALID_CREDENTIALS"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password.
                requestId: 7a2b9c1d-4e3f-4a5b-9c6d-1e2f3a4b5c6d
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: "Error 429: AUTH_RATE_LIMITED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: AUTH_RATE_LIMITED
                  message: Too many sign-in attempts. Try again in a few minutes.
                requestId: 7a2b9c1d-4e3f-4a5b-9c6d-1e2f3a4b5c6d
  /auth/me:
    get:
      tags:
        - Auth
      operationId: me
      summary: Get the signed-in user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                    required:
                      - user
                required:
                  - success
                  - data
              example:
                success: true
                data:
                  user:
                    id: 3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                    name: Juan Dela Cruz
                    email: juan@nexuspc.test
                    role: customer
                    createdAt: 2026-11-12T08:30:00.000Z
        "401":
          $ref: "#/components/responses/Unauthorized"
  /categories:
    get:
      tags:
        - Catalog
      operationId: listCategories
      summary: List product categories
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
                required:
                  - success
                  - data
              example:
                success: true
                data:
                  - id: 7a2b9c1d-4e3f-4a5b-9c6d-1e2f3a4b5c6d
                    name: Processors
                    slug: processors
                    description: Desktop CPUs.
  /products:
    get:
      tags:
        - Catalog
      operationId: listProducts
      summary: Search and filter active products
      description: Only active products are returned.
      security: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Items per page.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
        - name: search
          in: query
          required: false
          description: Matches product name or brand.
          schema:
            type: string
            maxLength: 60
        - name: category
          in: query
          required: false
          description: Category slug, for example processors.
          schema:
            type: string
        - name: minPriceCents
          in: query
          required: false
          description: Minimum price in centavos.
          schema:
            type: integer
            minimum: 0
        - name: maxPriceCents
          in: query
          required: false
          description: Maximum price in centavos.
          schema:
            type: integer
            minimum: 0
        - name: sort
          in: query
          required: false
          description: Sort order (fixed list).
          schema:
            type: string
            enum:
              - newest
              - price_asc
              - price_desc
              - name_asc
            default: newest
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
                required:
                  - success
                  - data
                  - meta
              example:
                success: true
                data:
                  - id: 3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                    name: AMD Ryzen 5 7600
                    brand: AMD
                    description: 6-core Zen 4 processor.
                    priceCents: 1399000
                    stock: 25
                    imageUrl: null
                    specs:
                      socket: AM5
                      cores: 6
                      tdp: 65
                      ramType: DDR5
                    isActive: true
                    category:
                      id: 7a2b9c1d-4e3f-4a5b-9c6d-1e2f3a4b5c6d
                      name: Processors
                      slug: processors
                    createdAt: 2026-11-12T08:30:00.000Z
                    updatedAt: 2026-11-12T08:30:00.000Z
                meta:
                  total: 24
                  page: 1
                  limit: 12
                  totalPages: 1
        "422":
          $ref: "#/components/responses/ValidationError"
  /products/{id}:
    get:
      tags:
        - Catalog
      operationId: getProduct
      summary: Get one active product
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Resource id.
          schema:
            type: string
            format: uuid
            example: 3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Product"
                required:
                  - success
                  - data
              example:
                success: true
                data:
                  id: 3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                  name: AMD Ryzen 5 7600
                  brand: AMD
                  description: 6-core Zen 4 processor.
                  priceCents: 1399000
                  stock: 25
                  imageUrl: null
                  specs:
                    socket: AM5
                    cores: 6
                    tdp: 65
                    ramType: DDR5
                  isActive: true
                  category:
                    id: 7a2b9c1d-4e3f-4a5b-9c6d-1e2f3a4b5c6d
                    name: Processors
                    slug: processors
                  createdAt: 2026-11-12T08:30:00.000Z
                  updatedAt: 2026-11-12T08:30:00.000Z
        "404":
          description: "Error 404: PRODUCT_NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: PRODUCT_NOT_FOUND
                  message: Product not found.
                requestId: 7a2b9c1d-4e3f-4a5b-9c6d-1e2f3a4b5c6d
        "422":
          $ref: "#/components/responses/ValidationError"
  /cart:
    get:
      tags:
        - Cart
      operationId: getCart
      summary: Get my cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Cart"
                required:
                  - success
                  - data
              example:
                success: true
                data:
                  items:
                    - productId: 3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                      name: AMD Ryzen 5 7600
                      brand: AMD
                      imageUrl: null
                      categorySlug: processors
                      unitPriceCents: 1399000
                      quantity: 1
                      lineTotalCents: 1399000
                      stock: 25
                      issue: null
                  itemCount: 1
                  subtotalCents: 1399000
                  hasIssues: false
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags:
        - Cart
      operationId: clearCart
      summary: Empty my cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Cart"
                required:
                  - success
                  - data
              example:
                success: true
                data:
                  items: []
                  itemCount: 0
                  subtotalCents: 0
                  hasIssues: false
        "401":
          $ref: "#/components/responses/Unauthorized"
  /cart/items:
    post:
      tags:
        - Cart
      operationId: addCartItem
      summary: Add a product to my cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartAddInput"
            example:
              productId: 3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
              quantity: 1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Cart"
                required:
                  - success
                  - data
              example:
                success: true
                data:
                  items:
                    - productId: 3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                      name: AMD Ryzen 5 7600
                      brand: AMD
                      imageUrl: null
                      categorySlug: processors
                      unitPriceCents: 1399000
                      quantity: 1
                      lineTotalCents: 1399000
                      stock: 25
                      issue: null
                  itemCount: 1
                  subtotalCents: 1399000
                  hasIssues: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "Error 404: PRODUCT_NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: PRODUCT_NOT_FOUND
                  message: Product not found.
                requestId: 7a2b9c1d-4e3f-4a5b-9c6d-1e2f3a4b5c6d
        "409":
          description: "Error 409: INSUFFICIENT_STOCK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INSUFFICIENT_STOCK
                  message: Only 3 left in stock.
                requestId: 7a2b9c1d-4e3f-4a5b-9c6d-1e2f3a4b5c6d
        "422":
          $ref: "#/components/responses/ValidationError"
  /cart/items/{productId}:
    patch:
      tags:
        - Cart
      operationId: setCartItemQuantity
      summary: Change the quantity of a cart item
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          description: Product id.
          schema:
            type: string
            format: uuid
            example: 3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartQuantityInput"
            example:
              quantity: 2
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Cart"
                required:
                  - success
                  - data
              example:
                success: true
                data:
                  items:
                    - productId: 3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                      name: AMD Ryzen 5 7600
                      brand: AMD
                      imageUrl: null
                      categorySlug: processors
                      unitPriceCents: 1399000
                      quantity: 1
                      lineTotalCents: 1399000
                      stock: 25
                      issue: null
                  itemCount: 1
                  subtotalCents: 1399000
                  hasIssues: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "Error 404: CART_ITEM_NOT_FOUND"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: CART_ITEM_NOT_FOUND
                  message: That item is not in your cart.
                requestId: 7a2b9c1d-4e3f-4a5b-9c6d-1e2f3a4b5c6d
        "409":
          description: "Error 409: INSUFFICIENT_STOCK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INSUFFICIENT_STOCK
                  message: Only 3 left in stock.
                requestId: 7a2b9c1d-4e3f-4a5b-9c6d-1e2f3a4b5c6d
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags:
        - Cart
      operationId: removeCartItem
      summary: Remove an item from my cart
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          description: Product id.
          schema:
            type: string
            format: uuid
            example: 3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Cart"
                required:
                  - success
                  - data
              example:
                success: true
                data:
                  items: []
                  itemCount: 0
                  subtotalCents: 0
                  hasIssues: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /orders/quote:
    post:
      tags:
        - Orders
      operationId: quoteOrder
      summary: Price my cart with an optional coupon
      description: Prices always come from the database.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
            example:
              couponCode: WELCOME10
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/QuoteResult"
                required:
                  - success
                  - data
              example:
                success: true
                data:
                  subtotalCents: 1399000
                  discountCents: 139900
                  shippingCents: 0
                  totalCents: 1259100
                  coupon:
                    couponId: b8d4e6f0-1a2b-4c3d-8e4f-5a6b7c8d9e0f
                    code: WELCOME10
                    discountCents: 139900
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: "Error 409: CART_EMPTY"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: CART_EMPTY
                  message: Your cart is empty.
                requestId: 7a2b9c1d-4e3f-4a5b-9c6d-1e2f3a4b5c6d
        "422":
          description: "Error 422: COUPON_EXPIRED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: COUPON_EXPIRED
                  message: This coupon has expired.
                requestId: 7a2b9c1d-4e3f-4a5b-9c6d-1e2f3a4b5c6d
  /orders:
    post:
      tags:
        - Orders
      operationId: createOrder
      summary: Place an order from my cart
      description: Reserves stock for 15 minutes. Needs an Idempotency-Key header. Repeating the same key returns the original order with status 200.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique per checkout attempt, 8-100 characters (letters, numbers, - or _). Repeating the same key returns the same order.
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{8,100}$
            example: 5b1c7c0e-9f55-4a0f-8a0e-2d1f4b7c9a11
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
            example:
              shipping:
                name: Juan Dela Cruz
                phone: "09171234567"
                address: 123 Rizal St, Barangay Uno, Iligan City
              couponCode: WELCOME10
      responses:
        "200":
          description: "Same Idempotency-Key repeated: the original order"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Order"
                required:
                  - success
                  - data
              example:
                success: true
                data:
                  id: 3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                  status: pending_payment
                  subtotalCents: 1399000
                  discountCents: 0
                  shippingCents: 0
                  totalCents: 1399000
                  currency: PHP
                  couponCode: null
                  flagged: false
                  shipping:
                    name: Juan Dela Cruz
                    phone: "09171234567"
                    address: 123 Rizal St, Barangay Uno, Iligan City
                  items:
                    - productId: 3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                      name: AMD Ryzen 5 7600
                      unitPriceCents: 1399000
                      quantity: 1
                      lineTotalCents: 1399000
                  history:
                    - from: null
                      to: pending_payment
                      note: Order placed
                      createdAt: 2026-11-12T08:30:00.000Z
                  expiresAt: 2026-11-12T08:45:00.000Z
                  createdAt: 2026-11-12T08:30:00.000Z
        "201":
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Order"
                required:
                  - success
                  - data
              example:
                success: true
                data:
                  id: 3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                  status: pending_payment
                  subtotalCents: 1399000
                  discountCents: 0
                  shippingCents: 0
                  totalCents: 1399000
                  currency: PHP
                  couponCode: null
                  flagged: false
                  shipping:
                    name: Juan Dela Cruz
                    phone: "09171234567"
                    address: 123 Rizal St, Barangay Uno, Iligan City
                  items:
                    - productId: 3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                      name: AMD Ryzen 5 7600
                      unitPriceCents: 1399000
                      quantity: 1
                      lineTotalCents: 1399000
                  history:
                    - from: null
                      to: pending_payment
                      note: Order placed
                      createdAt: 2026-11-12T08:30:00.000Z
                  expiresAt: 2026-11-12T08:45:00.000Z
                  createdAt: 2026-11-12T08:30:00.000Z
        "401":
