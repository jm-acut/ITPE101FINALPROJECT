            minimum: 0
        - name: maxPriceCents
          in: query
          required: false
          description: Maximum price in centavos.
          schema:
            type: integer
            minimum: 0
        - name: sort
          in: query
          required: false
          description: Sort order (fixed list).
          schema:
            type: string
            enum:
