  /webhooks/maya:
    post:
      tags:
        - Payments
      operationId: mayaWebhook
      summary: Receive Maya payment events (called by Maya, not by the frontend)
      description: The signature (RSA-SHA256 over the sorted flattened payload plus the nonce) and a 5-minute timestamp window are verified before anything changes. The response is NOT wrapped in the usual envelope.
      security: []
      parameters:
        - name: X-Maya-Webhook-Signature
          in: header
          required: true
          description: nonce=<nonce>,v1=<hex signature>
          schema:
            type: string
            example: nonce=abc123,v1=9f8e7d...
        - name: X-Maya-Webhook-Timestamp
          in: header
          required: true
          description: Unix time in milliseconds.
          schema:
            type: string
            example: "1794470000000"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Maya payment object.
              additionalProperties: true
            example:
              id: pay_123
              isPaid: true
              status: PAYMENT_SUCCESS
              amount: 13990
              currency: PHP
              requestReferenceNumber: 3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
      responses:
        "200":
          description: Event processed, duplicate, or ignored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResult"
              example:
                received: true
                outcome: paid
        "400":
          description: "Error 400: INVALID_JSON"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INVALID_JSON
                  message: Webhook body is not valid JSON.
                requestId: 7a2b9c1d-4e3f-4a5b-9c6d-1e2f3a4b5c6d
        "401":
          description: "Error 401: INVALID_SIGNATURE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INVALID_SIGNATURE
                  message: Webhook signature does not match.
                requestId: 7a2b9c1d-4e3f-4a5b-9c6d-1e2f3a4b5c6d
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: "Error 503: PAYMENT_NOT_CONFIGURED"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: PAYMENT_NOT_CONFIGURED
                  message: Online payment is not configured on this server.
                requestId: 7a2b9c1d-4e3f-4a5b-9c6d-1e2f3a4b5c6d
