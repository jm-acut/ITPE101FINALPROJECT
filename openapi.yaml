components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from POST /auth/login.
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Validation failed.
            details:
              type: array
              items:
                type: object
                properties:
                  in:
                    type: string
                    example: body
                  field:
                    type: string
                    example: email
                  message:
                    type: string
                    example: Enter a valid email address.
                required:
                  - field
                  - message
          required:
            - code
            - message
        requestId:
          type: string
          format: uuid
          example: 7a2b9c1d-4e3f-4a5b-9c6d-1e2f3a4b5c6d
      required:
        - success
        - error
        - requestId
    PageMeta:
      type: object
      properties:
        total:
          type: integer
          example: 24
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 12
        totalPages:
          type: integer
          example: 2
      required:
        - total
        - page
        - limit
        - totalPages
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 7a2b9c1d-4e3f-4a5b-9c6d-1e2f3a4b5c6d
        name:
          type: string
          example: Processors
        slug:
          type: string
          example: processors
        description:
          type: string
          example: Desktop CPUs.
      required:
        - id
        - name
        - slug
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3f1c2d4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f
        name:
